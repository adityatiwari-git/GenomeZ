{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}GenomeZ{% endblock %}</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <link rel="stylesheet"
      href="{% static 'css/analyzer.css' %}">

</head>

<body class="app-body">

<nav class="navbar navbar-expand-lg bg-white border-bottom">

    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold" href="{% url 'home' %}">

            Genome<span class="text-success">Z</span>

        </a>

        <div class="ms-auto d-flex align-items-center gap-2">

            <a href="{% url 'home' %}" class="btn btn-light px-3">
                Website
            </a>

            <a href="{% url 'analyzer' %}" class="btn btn-primary px-3">
                Analyzer
            </a>

            {% if request.user.is_authenticated %}
                <span class="auth-user-label d-none d-md-inline">
                    <i class="bi bi-person-circle"></i> {{ request.user.username }}
                </span>
                <a href="{% url 'logout' %}" class="btn btn-outline-secondary px-3">
                    Logout
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-primary px-3">
                    Login
                </a>
            {% endif %}

        </div>

    </div>

</nav>

{% block content %}

{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/analyzer.js' %}"></script>

</body>

</html>
