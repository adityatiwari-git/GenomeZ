name: Scheduled Project Maintenance

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run scheduled task
        run: python .github/maintenance/run_task.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Detect meaningful change
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful change was made. No commit or PR will be created."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run project checks
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          if [ -f manage.py ]; then
            python manage.py check
            python manage.py test
          elif [ -f package.json ]; then
            npm ci
            npm run lint --if-present
            npm run build --if-present
          elif [ -f requirements.txt ]; then
            python -m compileall .
          else
            echo "No standard project check detected."
          fi

      - name: Create maintenance branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="maintenance/$(date -u +%Y-%m-%d)-\${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git switch -c "$BRANCH"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: scheduled project maintenance"
          git push --set-upstream origin "$BRANCH"

      - name: Open draft pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --draft \
            --base "\${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "Scheduled project maintenance" \
            --body "Predefined repository-specific maintenance change scheduled for this date."
